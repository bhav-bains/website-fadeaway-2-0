# CENTRAL WORK COLLECTION (founder, Oct 4): every Fadeaway project lives here, one item each. Pages pull from it;
# nothing is hardcoded per page. Case studies keep their full story in src/content/case-studies/ and appear here as a
# `kind: case-study` index entry that points to it (title, summary, image and results come from the case study).
#
# Where entries show (helper: getWork({ kind, tag, limit }) in src/lib/work.ts; skips hidden; order = kind order case-study, featured, labs, list; then rank)
#   /portfolio/          everything visible: case-study, then featured, then labs, then list (founder, Oct 4)
#   /labs/               kind: labs. "From Labs to Live Users" = every labs entry without the `internal` tag (3 across);
#                        then the internal tools and demo sites (tag `internal`: "Internal" badge, never linked).
#                        `internal` entries show on /labs/ ONLY (founder, Oct 4): getWork() skips them unless includeInternal.
#   Home, Build, Growth, solution pages ("Real Work" sections): case studies with the page tag first, then featured and
#                        labs entries with the page tag; max 3 cards; list items never show outside /portfolio/
#   /case-studies/       the case-studies collection (unchanged)
#
# Portfolio entries (/portfolio/). One item per project; add a project by adding one item.
# Real Fadeaway work only, with client consent (founder, Oct 2). Never invent a project, result or quote.
#
# Fields
#   id          unique slug
#   name        shown name
#   url         live site (omit when there is no public link)
#   kind        featured | list | labs
#   group       list items only: ecommerce | practices | saas | organizations
#   industry    featured + labs: short label on the card
#   summary     featured + labs: 1 to 3 sentences, plain language
#   chips       featured + labs: short display tags
#   tags        content tags (src/data/tags.ts) so other pages can pull entries
#   status      labs only: live | beta | alpha
#   ongoing     true when the work is still running
#   image       optional, ../assets/portfolio/<id>/<id>-hero.png; imageAlt with it. Without one, featured + labs cards show line art
#   art         optional line art for a card without an image (illustrations/ name: ecommerce, wellness, fitness, sports,
#               wireframe, growth, launch, layers...). Default from tags and kind: ecommerce, wellness-counselling,
#               boutique-fitness, sports-academies, then labs → launch, build → wireframe, growth → growth
#   caseStudy   optional case-study slug; when set the card links there instead of the live site
#   hidden      true = never rendered (kept here so it is not forgotten)
#   nofollow    true = rel="nofollow" on this entry's outbound link (founder, Oct 4: not used for now; links pass normal SEO credit)
#   noreferrer  true = rel="noreferrer" on this entry's outbound link (founder, Oct 4: on for all featured + list items, so clicks show as direct traffic in client analytics; Labs and case studies stay normal)
#               Every external link always gets rel="noopener" and opens in a new tab.
#   list items may also take optional industry + chips (compact card); without them the card shows name, domain and group only
#   rank        order within its section (lower first)
#   owner       labs only: ours | cofounded | client | demo
#   caseStudy   case-study entries: slug of the entry in src/content/case-studies/

